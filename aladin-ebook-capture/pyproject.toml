[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aladin-ebook-capture"
version = "0.1.0"
description = "Personal Aladin ebook page capture via official-viewer screenshots (agent-friendly CLI)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aladin ebook capture contributors" }]
dependencies = [
  "mss>=9.0.1",
  "pyautogui>=0.9.54",
  "PyYAML>=6.0.1",
  "img2pdf>=0.5.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
aladin-capture = "aladin_capture.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
